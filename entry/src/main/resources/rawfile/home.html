<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Browser</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
      color: #f4f4f5;
      font-family: -apple-system, "HarmonyOS Sans", system-ui, sans-serif;
      overflow-x: hidden;
    }
    .wrap {
      min-height: 100vh;
      padding: 16px 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label {
      font-family: ui-monospace, "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 3px;
      color: #6b6b73;
      margin-bottom: 22px;
    }
    .list {
      width: 100%;
      max-width: 320px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.site {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 64px;
      padding: 0 20px;
      border-radius: 32px;
      background: #161618;
      border: 1px solid #232327;
      text-decoration: none;
      transition: background .15s, transform .1s;
    }
    a.site:active { background: #1f1f24; transform: scale(0.98); }
    .mono-badge {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #0a0a0a;
    }
    .meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .name {
      font-size: 18px; font-weight: 600; color: #f4f4f5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .host {
      font-family: ui-monospace, "JetBrains Mono", monospace;
      font-size: 11px; color: #6b6b73;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">WELCOME</div>
    <div class="list">
      <a class="site" href="native://https://medium.com/huawei-developers/swipe-to-delete-with-arkui-on-harmonyos-next-intuitive-ux-for-wearable-devices-ee92194eea36">
        <span class="mono-badge" style="background:#38bdf8;">S</span>
        <span class="meta"><span class="name">Swipe to Delete</span><span class="host">medium.com</span></span>
      </a>
      <a class="site" href="native://https://medium.com/huawei-developers/how-to-use-audiocapturer-and-audiorenderer-with-arkts-488823663dbf">
        <span class="mono-badge" style="background:#f97316;">A</span>
        <span class="meta"><span class="name">Audio Capturer</span><span class="host">medium.com</span></span>
      </a>
      <a class="site" href="native://https://medium.com/huawei-developers/gesture-events-in-harmonyos-next-arkts-9d387c8a11c1">
        <span class="mono-badge" style="background:#22c55e;">G</span>
        <span class="meta"><span class="name">Gesture Events</span><span class="host">medium.com</span></span>
      </a>
      <a class="site" href="native://https://wikipedia.org">
        <span class="mono-badge" style="background:#cbd5e1;">W</span>
        <span class="meta"><span class="name">Wikipedia</span><span class="host">wikipedia.org</span></span>
      </a>
    </div>
  </div>
</body>
</html>
